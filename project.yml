name: KuwaitSalah
options:
  bundleIdPrefix: com.rashid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  KuwaitSalah:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: SalahWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: منار القرآن
        CFBundleName: KuwaitSalah
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: لتحديد اتجاه القبلة باستخدام البوصلة
        NSMicrophoneUsageDescription: لتسميع القرآن بصوتك ومقارنته بالنص
        NSSpeechRecognitionUsageDescription: للتعرّف على تلاوتك وكشف الأخطاء في الحفظ
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - AmiriQuran.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashid.kuwaitsalah
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  SalahWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared/Prayer.swift
      - Shared/PrayerCalc.swift
      - Shared/Iqama.swift
      - Shared/Theme.swift
      - Shared/Format.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: منار القرآن
        CFBundleName: SalahWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashid.kuwaitsalah.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"

  KuwaitSalahTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/KuwaitSalahTests
    dependencies:
      - target: KuwaitSalah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashid.kuwaitsalah.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KuwaitSalah:
    build:
      targets:
        KuwaitSalah: all
        SalahWidget: all
    test:
      targets:
        - KuwaitSalahTests
