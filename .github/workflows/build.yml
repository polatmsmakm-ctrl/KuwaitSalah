name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project KuwaitSalah.xcodeproj \
            -scheme KuwaitSalah \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KuwaitSalah.app Payload/
          zip -qry KuwaitSalah.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KuwaitSalah-ipa
          path: KuwaitSalah.ipa

      - name: Publish IPA to ipa-build branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan ipa-build
          git rm -rf --cached . > /dev/null 2>&1 || true
          mkdir -p /tmp/out && cp KuwaitSalah.ipa /tmp/out/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/out/KuwaitSalah.ipa .
          git add KuwaitSalah.ipa
          git commit -m "IPA build"
          git push -f origin ipa-build
